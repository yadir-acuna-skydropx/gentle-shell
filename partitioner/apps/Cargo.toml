[package]
name = "gentle-apps"
version = "0.1.0"
edition = "2024"

[lib]
name = "gentle_apps"
path = "src/lib.rs"

[[bin]]
name = "gentle-apps"
path = "src/main.rs"

[dependencies]
gentle-engines = { path = "../engines" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", default-features = false, features = ["async-secret-service", "crypto-rust", "async-io"] }
sha2 = "0.10"
base64 = "0.23"
