[workspace]
members = [".", "apps"]
resolver = "2"

[package]
name = "gentle-partitioner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
gentle-apps = { path = "apps" }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde_json = "1"
unicode-width = "0.2"
vt100 = "0.18.1"

# Fast dev loop: dependencies are optimized once and cached, our crate stays
# unoptimized so edits rebuild quickly. Linux x86_64 already links with lld by
# default since Rust 1.90.
[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
